name: Express Typescript CI/cap_drop
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typescript type checking
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Jest Test
        run: npm test
  docker:
    name: Docker Build and Security Scan
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Check Dockerfile
        run: |
          docker run --rm \
          -i hadolint/hadolint < Dockerfile
      - name: Build image
        run: |
          docker build \
          -t express-ts-app:${{ github.sha }} .
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.3.0
        with:
          image-ref: express-ts-app:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os, library
          severity: HIGH, CRITICAL
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker tag \
          express-ts-app:${{ github.sha }} \
          ${{ secrets.DOCKERHUB_USERNAME }}/express-ts-app:${{ github.sha }}
          docker push \
          ${{ secrets.DOCKERHUB_USERNAME }}/express-ts-app:${{ github.sha }}
  deploy:
    name: Deploy Application
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy and Health check
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME}}/express-ts-app:${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: IMAGE
          script: |
            cd /opt/express-ts-app
            PREVIOUS_IMAGE=$(grep '^IMAGE=' .env | cut -d= -f2-)
            echo "IMAGE=$IMAGE" > .env
            rollback() {
              echo "Deployment failed. Rolling back..."
              if [ -n "$PREVIOUS_IMAGE" ]; then
                echo "IMAGE=$PREVIOUS_IMAGE" > .env
                docker compose pull
                docker compose up -d
              else
                docker compose down
              fi
            }

            if ! docker compose pull; then
              rollback
              exit 1
            fi

            if ! docker compose up -d; then
              rollback
              exit 1
            fi

            for i in $(seq 1 15); do
              if curl -fsS http://localhost:3000/health; then
                echo "Deployment successful!"
                exit 0
              fi

              sleep 2
            done

            rollback
            exit 1
